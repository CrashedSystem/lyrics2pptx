# 패키지 메타/설치 (아키텍처 08 §1 방식 A: src 레이아웃 + pip install -e .)
# 런타임 의존성의 정본 핀은 requirements.txt 이며, 여기서도 동일 버전을 선언한다.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrics2pptx"
version = "0.1.0b3"
description = "검색어 기반 가사 수집 → template.pptx 슬라이드 복제 후 2줄씩 채우기 (로컬 단일 사용자)"
requires-python = ">=3.12"
dependencies = [
    "python-pptx==1.0.2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
