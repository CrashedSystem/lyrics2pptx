<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>가사 2줄 PPTX 생성기</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <h1>가사 2줄 PPTX 생성기</h1>
    <p class="subtitle">검색어로 가사를 모아 <code>template.pptx</code> 의 배경 20장에 2줄씩 채웁니다.</p>
  </header>

  <main class="app-main">
    <section class="panel" aria-labelledby="input-heading">
      <h2 id="input-heading">1. 가사 가져오기</h2>

      <div class="mode-row" role="radiogroup" aria-label="입력 방식">
        <label class="radio">
          <input type="radio" name="mode" value="search" checked>
          <span>검색해서 가져오기</span>
        </label>
        <label class="radio">
          <input type="radio" name="mode" value="manual">
          <span>직접 입력</span>
        </label>
      </div>

      <div id="search-mode" class="mode-body">
        <div class="field-row">
          <label class="field-label" for="query">검색어</label>
          <input id="query" type="text" placeholder="예: 생명샘  또는  아티스트 - 곡명" autocomplete="off">
        </div>
        <div class="field-row">
          <label class="field-label" for="source">소스</label>
          <select id="source">
            <option value="lyrics_ovh">lyrics_ovh (공개 API)</option>
          </select>
          <button id="search-button" type="button" class="primary">검색</button>
        </div>
      </div>

      <div id="manual-mode" class="mode-body" hidden>
        <div class="field-row">
          <label class="field-label" for="raw-text">가사 붙여넣기</label>
          <textarea id="raw-text" rows="8" placeholder="가사를 붙여넣으세요. 빈 줄과 [Verse] 같은 표시는 자동으로 정리됩니다."></textarea>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="results-heading" id="results-panel" hidden>
      <h2 id="results-heading">2. 곡 선택</h2>
      <ul id="results" class="result-list" role="radiogroup" aria-label="검색 결과"></ul>
    </section>

    <section class="panel" aria-labelledby="preview-heading" id="preview-panel" hidden>
      <h2 id="preview-heading">3. 미리보기</h2>
      <p id="preview-summary" class="summary"></p>
      <ol id="preview" class="preview-list" start="1"></ol>
      <div class="pager">
        <button id="prev-page" type="button">← 이전 3장</button>
        <span id="page-label" class="page-label"></span>
        <button id="next-page" type="button">다음 3장 →</button>
      </div>

      <div class="options">
        <label class="checkbox">
          <input id="dedupe-chorus" type="checkbox">
          <span>후렴 등 반복 줄 줄이기</span>
        </label>
        <div class="field-row inline">
          <label class="field-label" for="filename">파일명</label>
          <input id="filename" type="text" value="가사.pptx">
        </div>
      </div>

      <button id="generate-button" type="button" class="primary">PPTX 생성</button>
    </section>

    <section class="panel download" id="download-panel" hidden>
      <h2>4. 다운로드</h2>
      <a id="download-link" href="#" download>가사.pptx 내려받기</a>
    </section>

    <p id="error" class="error" role="alert" hidden></p>
    <p id="status" class="status" role="status" hidden></p>
  </main>

  <footer class="app-footer">
    <p>가사 저작권은 권리자에게 있습니다. 개인 용도로만 사용하세요.</p>
    <p>자동 수집은 robots.txt 와 이용약관을 준수하는 소스만 기본 제공합니다.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
